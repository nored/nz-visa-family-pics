<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Photo Evidence</title>
<meta name="description" content="Pick family photos, add one caption line each, get one PDF in LaTeX typesetting. Photos never leave your device.">
<meta name="theme-color" content="#1f4d3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script src="vendor/pdf-lib.min.js" defer></script>
<script src="vendor/fontkit.umd.min.js" defer></script>
<script src="vendor/exifr-lite.umd.js" defer></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <h1>Family Photo Evidence</h1>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-choose" aria-selected="true" aria-controls="choose">1&nbsp;Choose <span id="tab-choose-n"></span></button>
    <button type="button" role="tab" id="tab-captions" aria-selected="false" aria-controls="captions">2&nbsp;Captions <span id="tab-captions-n"></span></button>
  </nav>
</header>

<main>
  <section id="choose" role="tabpanel" aria-labelledby="tab-choose">
    <div class="toolbar">
      <label class="btn primary" for="file-input">Add photos</label>
      <input id="file-input" type="file" accept="image/*,.heic,.heif" multiple hidden>
      <label class="btn desktop-only" for="folder-input">Add folder</label>
      <input id="folder-input" type="file" webkitdirectory multiple hidden>
      <button class="btn" id="select-all" type="button">Select all</button>
      <button class="btn" id="select-none" type="button">Select none</button>
    </div>
    <p id="progress" class="progress" hidden></p>
    <p id="choose-empty" class="empty">Add the photos you might use. Then tap each photo that should go into the PDF. Photos stay on this device.</p>
    <p id="choose-hint" class="hint" hidden>Tap a photo to include it. ⤢ shows it large.</p>
    <div id="grid"></div>
    <p class="fineprint" id="cleanup" hidden><button class="linkish" id="remove-unselected" type="button">Remove photos that are not selected</button> · <button class="linkish" id="clear-all" type="button">Remove everything</button></p>
  </section>

  <section id="captions" role="tabpanel" aria-labelledby="tab-captions" hidden>
    <p id="captions-empty" class="empty">No photos selected yet. Go to <b>1 Choose</b> and tap the photos you want.</p>
    <ol id="cards" class="cards"></ol>
    <details class="options">
      <summary>PDF options</summary>
      <div class="grid2">
        <label>Photos per page
          <select id="s-layout">
            <option value="1">1</option>
            <option value="2">2</option>
          </select>
        </label>
        <label>Paper
          <select id="s-paper">
            <option value="a4">A4</option>
            <option value="letter">US Letter</option>
          </select>
        </label>
        <label>Maximum file size (MB)
          <input id="s-limit" type="number" min="1" max="100" step="0.5" inputmode="decimal">
        </label>
      </div>
    </details>
  </section>
</main>

<footer class="bar">
  <span id="status" class="status" role="status"></span>
  <span class="bar-actions">
    <button class="btn primary big" id="make-btn" type="button">Create PDF</button>
    <a class="btn primary big" id="dl-btn" download hidden>Download PDF</a>
    <button class="btn big" id="share-btn" type="button" hidden>Share</button>
  </span>
</footer>

<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="viewer-top">
    <span id="viewer-pos"></span>
    <button type="button" class="vbtn" id="viewer-close" aria-label="Close">✕</button>
  </div>
  <img id="viewer-img" alt="">
  <div class="viewer-bottom">
    <button type="button" class="vbtn" id="viewer-prev" aria-label="Previous">‹</button>
    <button type="button" class="btn big" id="viewer-toggle"></button>
    <button type="button" class="vbtn" id="viewer-next" aria-label="Next">›</button>
  </div>
</div>

<template id="tile-tpl">
  <div class="tile">
    <button type="button" class="pick" aria-pressed="false"><img alt="" loading="lazy" decoding="async"><span class="tick" aria-hidden="true">✓</span></button>
    <button type="button" class="zoom" aria-label="Show large">⤢</button>
  </div>
</template>

<template id="card-tpl">
  <li class="card">
    <div class="card-img"><img alt="" loading="lazy" decoding="async"><span class="fig"></span></div>
    <div class="card-fields">
      <div class="date-row">
        <input class="f-date" type="date" aria-label="Date taken">
        <span class="date-src"></span>
        <button type="button" class="mini" data-act="rotate" aria-label="Rotate">⟳</button>
        <button type="button" class="mini" data-act="drop" aria-label="Take out of PDF">✕</button>
      </div>
      <textarea class="f-caption" rows="2" maxlength="400" enterkeyhint="next" aria-label="Caption" placeholder="One sentence about this photo"></textarea>
    </div>
  </li>
</template>
</body>
</html>
